[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferlib"
version = "0.2.7"
description = "CPU-first local inference for Qwen3 models with a Python API and OpenAI-compatible server."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["llm", "inference", "fastapi", "qwen", "serving"]
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.128.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.1",
    "torch>=2.9.1",
    "transformers>=5.2.0",
    "uvicorn>=0.40.0",
]

[project.urls]
Repository = "https://github.com/skandml/inferlib"
Issues = "https://github.com/skandml/inferlib/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[project.scripts]
inferlib = "inferlib.server.cli:main"

[tool.setuptools.packages.find]
include = ["inferlib*"]

[tool.ruff]
line-length = 110
